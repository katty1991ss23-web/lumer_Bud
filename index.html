<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Block</title>

    <link rel="stylesheet" href="css.css">
</head>

<body>

    <!-- =========================================================
        VIDEO BLOCK
        ========================================================= -->

    <section class="video-section">

        <div class="video-container">

            <video
                class="main-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            >
                <source src="host/1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

</div> <!-- закриваємо video-container -->

    <div class="btn-container">
        <a href="https://lumirbud.com.ua/" target="_blank" class="custom-btn">Перейти на сайт</a>
    </div>

    </section>
